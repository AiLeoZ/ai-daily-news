# 资讯源定义 —— RSS 订阅源
# 每行格式： 名称 || RSS地址 || 分类
# collect.py 会并发拉取这些源，提取近 7 天条目作为 AI 新闻的候选素材。
# 分类（category）仅用于标注，不参与筛选逻辑。
#
# 维护约定：新增/替换源前先跑 `python3 scripts/collect.py --health` 体检，
# 确认返回的是 RSS/Atom（而非 HTML）且窗口内有条目，再写入本文件。
# 最近一次体检：2026-08-05。

feeds:
  # —— 产业与media（中文） ——
  - "量子位 || https://www.qbitai.com/feed || news"
  - "InfoQ 中国 || https://www.infoq.cn/feed || news"

  # —— 产业与media（英文） ——
  - "TechCrunch AI || https://techcrunch.com/category/artificial-intelligence/feed/ || news"
  - "The Verge AI || https://www.theverge.com/rss/ai-artificial-intelligence/index.xml || news"
  - "MIT Tech Review AI || https://www.technologyreview.com/topic/artificial-intelligence/feed || news"

  # —— 厂商官方 ——
  - "OpenAI News || https://openai.com/news/rss.xml || vendor"
  - "Google AI Blog || https://blog.google/technology/ai/rss/ || vendor"
  - "Google DeepMind || https://deepmind.google/blog/rss.xml || vendor"

  # —— 学术预印本 ——
  - "ArXiv cs.AI || https://arxiv.org/rss/cs.AI || research"

